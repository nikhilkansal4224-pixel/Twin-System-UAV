<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Latest Release</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-heading: #ffffff;
      --accent: #238636;
      --accent-hover: #2ea043;
      --subtext: #8b949e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    h1 {
      color: var(--text-heading);
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 1.75rem;
    }

    .tag {
      display: inline-block;
      background: #1f6feb23;
      color: #58a6ff;
      border: 1px solid #1f6feb66;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    p {
      color: var(--subtext);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .download-btn {
      display: inline-block;
      width: 100%;
      background-color: var(--accent);
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      box-sizing: border-box;
      transition: background-color 0.2s ease;
      margin-bottom: 12px;
    }

    .download-btn:hover {
      background-color: var(--accent-hover);
    }

    .assets-list {
      margin-top: 20px;
      text-align: left;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .assets-list h3 {
      font-size: 0.9rem;
      color: var(--subtext);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .assets-list ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .assets-list li {
      margin-bottom: 8px;
    }

    .assets-list a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.9rem;
      word-break: break-all;
    }

    .assets-list a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="title">Project Name</h1>
    <div id="tag" class="tag">Checking releases...</div>
    <p id="description">Click below to download the latest release files for this project.</p>

    <a id="primary-btn" href="#" class="download-btn" style="display: none;">Download Latest Release</a>

    <div id="assets-container" class="assets-list" style="display: none;">
      <h3>All Release Assets</h3>
      <ul id="assets-list"></ul>
    </div>
  </div>

  <script>
    // Configuration: Replace with your GitHub username and repository name
    const USERNAME = 'YOUR_GITHUB_USERNAME';
    const REPO = 'YOUR_REPO_NAME';

    async function fetchLatestRelease() {
      const titleEl = document.getElementById('title');
      const tagEl = document.getElementById('tag');
      const btnEl = document.getElementById('primary-btn');
      const assetsContainer = document.getElementById('assets-container');
      const assetsList = document.getElementById('assets-list');

      titleEl.textContent = REPO;

      try {
        const response = await fetch(`https://api.github.com/repos/${Nikhilkansal4224-pixel}/${Twin-System-UAV}/releases/latest`);
        
        if (!response.ok) throw new Error('Release not found');
        
        const data = await response.json();

        tagEl.textContent = data.tag_name;

        if (data.assets && data.assets.length > 0) {
          // Set the main button to the first asset (e.g., zip, exe, tar.gz)
          btnEl.href = data.assets[0].browser_download_url;
          btnEl.textContent = `Download ${data.assets[0].name}`;
          btnEl.style.display = 'block';

          // List all available assets
          assetsList.innerHTML = '';
          data.assets.forEach(asset => {
            const li = document.createElement('li');
            li.innerHTML = `<a href="${asset.browser_download_url}">${asset.name}</a>`;
            assetsList.appendChild(li);
          });
          assetsContainer.style.display = 'block';
        } else {
          // Fallback to source code zip if no binary assets are uploaded
          btnEl.href = data.zipball_url;
          btnEl.textContent = 'Download Source Code (.zip)';
          btnEl.style.display = 'block';
        }
