version: '3.8'

networks:
  uav_network:
    driver: bridge

services:
  # =====================================================================
  # 1. ZOOKEEPER SERVICE
  # =====================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: uav_zookeeper
    networks:
      - uav_network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # =====================================================================
  # 2. KAFKA BROKER SERVICE
  # =====================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: UAV_kafka
    depends_on:
      - zookeeper
    networks:
      - uav_network
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # =====================================================================
  # 3. POSTGRESQL DATABASE
  # =====================================================================
  postgres:
    image: postgres:15-alpine
    container_name: uav_postgres
    networks:
      - uav_network
    environment:
      POSTGRES_DB: uav_telemetry
      POSTGRES_USER: uav_user
      POSTGRES_PASSWORD: uav_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # =====================================================================
  # 4. DIGITAL TWIN BACKGROUND WORKER
  # =====================================================================
  digital_twin_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uav_twin_worker
    depends_on:
      - kafka
      - postgres
    networks:
      - uav_network
    environment:
      KAFKA_BOOTSTRAP_SERVERS: 'kafka:29092'
      POSTGRES_HOST: 'postgres'
      POSTGRES_DB: 'uav_telemetry'
      POSTGRES_USER: 'uav_user'
      POSTGRES_PASSWORD: 'uav_password'
    restart: on-failure

  # =====================================================================
  # 5. STREAMLIT CONTROL DASHBOARD
  # =====================================================================
  control_dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uav_control_dashboard
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - postgres
    networks:
      - uav_network
    ports:
      - "8501:8501"
    environment:
      POSTGRES_HOST: 'postgres'
      POSTGRES_DB: 'uav_telemetry'
      POSTGRES_USER: 'uav_user'
      POSTGRES_PASSWORD: 'uav_password'

  # =====================================================================
  # 6. GRAFANA METRICS DASHBOARD (OPTIONAL)
  # =====================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: uav_grafana
    depends_on:
      - postgres
    networks:
      - uav_network
    ports:
      - "3000:3000"

volumes:
  postgres_data: